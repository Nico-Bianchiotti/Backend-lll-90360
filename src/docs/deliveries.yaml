paths:
  /api/deliveries:
    get:
      tags: [Deliveries]
      summary: Listar entregas
      description: Devuelve todas las entregas, de la más nueva a la más vieja, con los datos públicos del pedido y del repartidor.
      responses:
        '200':
          description: Lista de entregas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        type: array
                        items:
                          $ref: '#/components/schemas/Delivery'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags: [Deliveries]
      summary: Crear la entrega de un pedido
      description: Cada pedido puede tener una sola entrega. Si se indica repartidor, la entrega nace `assigned`; si no, `pending`. El código de seguimiento lo genera la API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '201':
          description: Entrega creada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: Datos inválidos. `VALIDATION_ERROR` (falta el pedido o la fecha es inválida) o `USER_NOT_COURIER` (el usuario indicado no es repartidor).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                faltaPedido:
                  summary: Falta el pedido
                  value:
                    status: error
                    statusCode: 400
                    error: VALIDATION_ERROR
                    message: La entrega debe indicar el pedido (order)
                noEsRepartidor:
                  summary: El usuario no es repartidor
                  value:
                    status: error
                    statusCode: 400
                    error: USER_NOT_COURIER
                    message: El usuario indicado tiene rol "user"; solo un usuario con rol "courier" puede hacer entregas
        '404':
          description: No existe el pedido (`ORDER_NOT_FOUND`) o el repartidor (`USER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                pedidoInexistente:
                  summary: El pedido no existe
                  value:
                    status: error
                    statusCode: 404
                    error: ORDER_NOT_FOUND
                    message: El pedido solicitado no existe
                repartidorInexistente:
                  summary: El repartidor no existe
                  value:
                    status: error
                    statusCode: 404
                    error: USER_NOT_FOUND
                    message: No se encontró el repartidor indicado
        '409':
          description: El pedido ya tiene una entrega.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 409
                error: DELIVERY_ALREADY_EXISTS
                message: El pedido ya tiene una entrega asociada
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deliveries/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Deliveries]
      summary: Obtener una entrega
      responses:
        '200':
          description: Entrega encontrada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Delivery'
        '404':
          description: La entrega no existe (o el ID tiene un formato inválido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: DELIVERY_NOT_FOUND
                message: La entrega solicitada no existe
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deliveries/{id}/status:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Deliveries]
      summary: Cambiar el estado de una entrega
      description: |
        - Los estados `assigned`, `in_transit` y `delivered` requieren que la entrega tenga repartidor.
        - Al pasar a `delivered` se completa `deliveredAt`.
        - Una entrega `delivered` o `cancelled` ya no puede modificarse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryStatusInput'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: Estado inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 400
                error: INVALID_DELIVERY_STATUS
                message: 'El estado "on_the_way" no es válido para una entrega. Valores permitidos: pending, assigned, in_transit, delivered, cancelled'
        '404':
          description: La entrega no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: DELIVERY_NOT_FOUND
                message: La entrega solicitada no existe
        '409':
          description: La entrega no tiene repartidor (`DELIVERY_COURIER_REQUIRED`) o ya está en un estado final (`DELIVERY_STATUS_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                sinRepartidor:
                  summary: Falta asignar repartidor
                  value:
                    status: error
                    statusCode: 409
                    error: DELIVERY_COURIER_REQUIRED
                    message: La entrega necesita un repartidor asignado para pasar al estado "in_transit"
                estadoFinal:
                  summary: La entrega ya terminó
                  value:
                    status: error
                    statusCode: 409
                    error: DELIVERY_STATUS_LOCKED
                    message: La entrega está en estado "delivered" y ya no puede modificarse
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deliveries/{id}/courier:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    patch:
      tags: [Deliveries]
      summary: Asignar repartidor a una entrega
      description: Asigna (o cambia) el repartidor. Si la entrega estaba `pending`, pasa a `assigned`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryCourierInput'
      responses:
        '200':
          description: Repartidor asignado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      payload:
                        $ref: '#/components/schemas/Delivery'
        '400':
          description: Falta el repartidor (`VALIDATION_ERROR`) o el usuario no es repartidor (`USER_NOT_COURIER`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 400
                error: USER_NOT_COURIER
                message: El usuario indicado tiene rol "user"; solo un usuario con rol "courier" puede hacer entregas
        '404':
          description: No existe la entrega (`DELIVERY_NOT_FOUND`) o el repartidor (`USER_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: DELIVERY_NOT_FOUND
                message: La entrega solicitada no existe
        '409':
          description: La entrega ya está en un estado final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 409
                error: DELIVERY_STATUS_LOCKED
                message: La entrega está en estado "cancelled" y ya no puede modificarse
        '500':
          $ref: '#/components/responses/InternalError'
