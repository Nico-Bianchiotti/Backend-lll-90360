paths:
  /api/orders:
    get:
      tags:
      - Orders
      summary: Listar pedidos
      description: Devuelve todos los pedidos, del más nuevo al más viejo, con los datos públicos del usuario.
      responses:
        '200':
          description: Lista de pedidos
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      type: array
                      items:
                        $ref: '#/components/schemas/Order'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
    post:
      tags:
      - Orders
      summary: Crear pedido
      description: Crea un pedido para un cliente. El pedido nace en estado `created` y el `total` lo calcula la API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/Order'
        '400':
          description: Datos inválidos. `VALIDATION_ERROR` (faltan datos o un item es incorrecto), `INVALID_ORDER_PRIORITY` (prioridad inexistente) u `ORDER_OWNER_NOT_CLIENT` (el usuario no es un cliente). También `INVALID_ID` si `user` no tiene formato de ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                faltanDatos:
                  summary: Faltan items o dirección
                  value:
                    status: error
                    statusCode: 400
                    error: VALIDATION_ERROR
                    message: El pedido debe incluir user, items y dirección de entrega (street y city)
                itemInvalido:
                  summary: Item con cantidad inválida
                  value:
                    status: error
                    statusCode: 400
                    error: VALIDATION_ERROR
                    message: 'Item 1: la cantidad debe ser un número entero mayor o igual a 1'
                prioridadInvalida:
                  summary: Prioridad inexistente
                  value:
                    status: error
                    statusCode: 400
                    error: INVALID_ORDER_PRIORITY
                    message: 'La prioridad "ya" no es válida. Valores permitidos: low, normal, high, urgent'
                usuarioNoCliente:
                  summary: El usuario es un repartidor
                  value:
                    status: error
                    statusCode: 400
                    error: ORDER_OWNER_NOT_CLIENT
                    message: Solo los usuarios con rol "user" pueden tener pedidos (el usuario indicado tiene rol "courier")
                idInvalido_user:
                  summary: ID con formato inválido (user)
                  value:
                    status: error
                    statusCode: 400
                    error: INVALID_ID
                    message: El valor "abc" no es un ID válido para el campo "user" (se esperan 24 caracteres hexadecimales)
        '404':
          description: El usuario indicado no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: USER_NOT_FOUND
                message: No se encontró el usuario indicado para crear el pedido
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}:
    parameters:
    - $ref: '#/components/parameters/IdParam'
    get:
      tags:
      - Orders
      summary: Obtener un pedido
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/InvalidId'
        '404':
          description: El pedido no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: ORDER_NOT_FOUND
                message: El pedido solicitado no existe
        '500':
          $ref: '#/components/responses/InternalError'
  /api/orders/{id}/status:
    parameters:
    - $ref: '#/components/parameters/IdParam'
    patch:
      tags:
      - Orders
      summary: Cambiar el estado de un pedido
      description: Un pedido `delivered` o `cancelled` ya no puede cambiar de estado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusInput'
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessResponse'
                - type: object
                  properties:
                    payload:
                      $ref: '#/components/schemas/Order'
        '400':
          description: Estado inválido. También `INVALID_ID` si `id` no tiene formato de ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                principal:
                  summary: INVALID_ORDER_STATUS
                  value:
                    status: error
                    statusCode: 400
                    error: INVALID_ORDER_STATUS
                    message: 'El estado "on_the_way" no es válido para un pedido. Valores permitidos: created, assigned, picked_up, in_transit, delivered, cancelled'
                idInvalido_id:
                  summary: ID con formato inválido (id)
                  value:
                    status: error
                    statusCode: 400
                    error: INVALID_ID
                    message: El valor "abc" no es un ID válido para el campo "id" (se esperan 24 caracteres hexadecimales)
        '404':
          description: El pedido no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 404
                error: ORDER_NOT_FOUND
                message: El pedido solicitado no existe
        '409':
          description: El pedido ya está en un estado final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                statusCode: 409
                error: ORDER_STATUS_LOCKED
                message: El pedido está en estado "delivered" y ya no puede cambiar de estado
        '500':
          $ref: '#/components/responses/InternalError'
